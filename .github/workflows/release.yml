name: Release

# Pushing a tag such as v0.1.5 builds the site and attaches ONE file, sourcly-v0.1.5.html, to a GitHub Release.
# That file is the whole app: people download it and double-click it (no zip, no other file). The site itself offers
# no download and sends nothing to GitHub: its footer only links to this Releases page.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 1. The version is written once, in the root package.json. The tag must be "v" plus that version, and
      #    CITATION.cff must agree. This runs first, so a wrong tag fails at once with a clear message.
      - name: The tag must be v + the version in package.json
        run: node scripts/version.mjs check "$GITHUB_REF_NAME"

      # Reads the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # 2. Install, check, build, and check that the built page really is one self-contained file.
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:scripts
      - run: pnpm build
      - run: pnpm check:single-file

      # 3. The built file, renamed after the tag, is the release's only asset.
      - name: Name the file after the tag
        run: cp apps/web/dist/index.html "sourcly-${GITHUB_REF_NAME}.html"

      # 4. The release notes: the version and one line on how to open the file.
      - name: Write the release notes
        run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" > release-notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "sourcly-${GITHUB_REF_NAME}.html" \
            --title "Sourcly ${GITHUB_REF_NAME#v}" --notes-file release-notes.md
